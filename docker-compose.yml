services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: uno-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-myuser}
      POSTGRES_PASSWORD: ${DB_PASS:-mypassword}
      POSTGRES_DB: ${DB_NAME:-mydb}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - thelastcard_app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-myuser}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # NestJS Server
  server:
    build:
      context: .
      dockerfile: ./server/Dockerfile
    container_name: uno-server
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USER:-myuser}
      DB_PASSWORD: ${DB_PASS:-mypassword}
      DB_DATABASE: ${DB_NAME:-mydb}
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production}
    ports:
      - "3000:3000"
      - "3002:3002"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - thelastcard_app-network
    restart: unless-stopped

  # Angular Client
  client:
    build:
      context: .
      dockerfile: ./client/Dockerfile
    container_name: uno-client
    ports:
      - "80:80"
    depends_on:
      - server
    networks:
      - thelastcard_app-network
    restart: unless-stopped

networks:
  thelastcard_app-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local

